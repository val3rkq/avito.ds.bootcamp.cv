# docker compose run --rm app baseline_paddle --out outputs/submission_v1.csv
# docker compose run --rm app                 -> список доступных скриптов
# docker compose up -d jupyter                -> http://localhost:8888
x-common: &common
  build: .
  image: avito-cv
  volumes:
    - ./test:/app/test:ro
    - ./sample_submission.csv:/app/sample_submission.csv:ro
    - ./data:/app/data
    - ./weights:/app/weights
    - ./outputs:/app/outputs
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./notebooks:/app/notebooks

services:
  app:
    <<: *common
  jupyter:
    <<: *common
    entrypoint: []
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=""
    ports: ["8888:8888"]
